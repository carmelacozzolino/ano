<!DOCTYPE html>
<html>
<head>
  <title>ano simulator</title>
  <style>
    body {
      background-color: #111;
      font-family: 'Comic Sans MS', sans-serif;
      color: #eee;
      text-align: center;
      padding-top: 50px;
      position: relative;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      margin: 10px;
      transition: transform 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    #result {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
    }

    #loading {
      font-size: 20px;
      color: #f0f0f0;
      margin-top: 20px;
      display: none;
    }

    #inventory {
      margin-top: 40px;
      font-size: 20px;
    }

    .character {
      margin: 10px;
    }

    .character img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
    }

    .shiny {
      animation: shiny-glow 1s infinite alternate;
      text-shadow: 0 0 10px gold;
    }

    @keyframes shiny-glow {
      from { filter: drop-shadow(0 0 5px gold); }
      to { filter: drop-shadow(0 0 15px gold); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .bounce {
      animation: bounce 1s ease infinite;
    }

    #eraseButton {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 16px;
      padding: 10px 20px;
    }

    #adminButton {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 30px;
      cursor: pointer;
      z-index: 1000;
    }

    #adminModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #222;
      padding: 30px;
      border-radius: 12px;
      z-index: 1001;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    #adminModal h2 {
      margin-top: 0;
    }

    .closeModal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
    }

    input[type="text"],
    input[type="number"],
    select {
      padding: 10px;
      font-size: 16px;
      margin: 5px 0;
    }

    .admin-controls {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>apri l'ano di shibi</h1>
  <button onclick="rollItem()">apri</button>
  <div id="loading">sto rullando...</div>
  <div id="result">clicca sul pulsante</div>
  <div id="image"></div>
  <div id="inventory"></div>
  <button id="eraseButton" onclick="confirmReset()">cancella progresso</button>

  <div style="margin-top:40px;">
    <h3>lascia una recensione</h3>
    <input id="secretInput" type="text" placeholder="scrivi qualcosa..." onkeydown="handleKey(event)">
    <div id="reviewMessage" style="margin-top:10px; color:lightgreen;"></div>
  </div>

  <!-- 🛠️ Admin Button -->
  <div id="adminButton" onclick="toggleAdminModal()">🛠️</div>

  <!-- Admin Modal -->
  <div id="adminModal">
    <div class="closeModal" onclick="toggleAdminModal()">✖</div>
    <h2>pannello admin</h2>
    <div class="admin-controls">
      <select id="characterSelect">
        <option value="lilli">lilli</option>
        <option value="mamma">mamma</option>
        <option value="babbo">babbo</option>
        <option value="nonna sbuffa">nonna sbuffa</option>
        <option value="peppa">peppa</option>
        <option value="zia puzza">zia puzza</option>
        <option value="carmela cozzolino">carmela cozzolino</option>
      </select>
      <input type="number" id="amountInput" min="1" value="1">
      <button onclick="addCharacter()">aggiungi</button>
    </div>
    <div class="admin-controls">
      <button onclick="toggleAutoClicker()">attiva/disattiva autoclicker</button>
    </div>
    <div class="admin-controls">
      <button onclick="hideAdminIcon()">nascondi icona</button>
    </div>
  </div>

  <script>
    const items = [
      { name: "lilli", chance: 43, color: "gray", image: "https://i.imgur.com/XZ9BFJf.jpeg" },
      { name: "mamma", chance: 30, color: "green", image: "https://i.imgur.com/y0nwHqo.jpeg" },
      { name: "babbo", chance: 10, color: "blue", image: "https://i.imgur.com/Nr3S7Op.jpeg" },
      { name: "nonna sbuffa", chance: 12, color: "purple", image: "https://i.imgur.com/RF1vAuN.jpeg" },
      { name: "peppa", chance: 3, color: "pink", image: "https://i.imgur.com/paK8Obq.jpeg", porkIcon: true },
      { name: "zia puzza", chance: 1.8, color: "gold", image: "https://i.imgur.com/i9vmLb3.png" },
      { name: "carmela cozzolino", chance: 0.2, color: "gold", image: "https://i.imgur.com/6wzgV0M.jpeg", shiny: true }
    ];

    let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
    let autoClickerInterval = null;
    let confirmResetOnce = false;

    function rollItem() {
      const resultDiv = document.getElementById("result");
      const imageDiv = document.getElementById("image");
      const loadingDiv = document.getElementById("loading");

      loadingDiv.style.display = "block";
      resultDiv.innerText = "";
      imageDiv.innerHTML = "";

      setTimeout(() => {
        loadingDiv.style.display = "none";

        let roll = Math.random() * 100;
        let cumulative = 0;

        for (let item of items) {
          cumulative += item.chance;
          if (roll <= cumulative) {
            if (!inventory[item.name]) inventory[item.name] = 0;
            inventory[item.name]++;
            localStorage.setItem("inventory", JSON.stringify(inventory));

            resultDiv.innerText = `hai trovato ${item.name}`;
            resultDiv.style.color = item.color;
            resultDiv.className = item.shiny ? "shiny" : "";

            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.name;
            img.width = 150;
            if (item.name === "carmela cozzolino") {
              resultDiv.classList.add("bounce");
              img.classList.add("bounce");
            } else {
              resultDiv.classList.remove("bounce");
            }

            imageDiv.appendChild(img);
            updateInventory();
            break;
          }
        }
      }, 1000);
    }

    function updateInventory() {
      const invDiv = document.getElementById("inventory");
      invDiv.innerHTML = "<h2>inventario</h2>";
      for (let item of items) {
        const count = inventory[item.name] || 0;
        let porkIcon = item.porkIcon
          ? `<img src="https://i.imgur.com/v9woUlU.jpeg" style="width:20px; height:20px; object-fit:cover; vertical-align:middle; margin-left:5px; border-radius:3px;" alt="pork">`
          : "";
        invDiv.innerHTML += `
          <div class="character">
            <img src="${item.image}" alt="${item.name}">
            <div style="color:${item.color}">${item.name}: ${count} ${porkIcon}</div>
          </div>
        `;
      }
    }

    function confirmReset() {
      const resultDiv = document.getElementById("result");
      if (!confirmResetOnce) {
        resultDiv.innerText = "sei sicuro che vuoi cancellare il tuo progresso? clicca di nuovo per confermare.";
        resultDiv.style.color = "red";
        confirmResetOnce = true;
        setTimeout(() => {
          confirmResetOnce = false;
          resultDiv.innerText = "clicca sul pulsante";
          resultDiv.style.color = "#eee";
        }, 5000);
      } else {
        localStorage.removeItem("inventory");
        inventory = {};
        updateInventory();
        resultDiv.innerText = "progresso cancellato!";
        resultDiv.style.color = "#eee";
        document.getElementById("image").innerHTML = "";
        confirmResetOnce = false;
      }
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        const input = document.getElementById("secretInput");
        const value = input.value.toLowerCase().trim();
        const message = document.getElementById("reviewMessage");

        if (value === "ano zozzo") {
          document.getElementById("adminButton").style.display = "block";
          message.innerText = "";
        } else {
          message.innerText = "grazie per la recensione!";
          setTimeout(() => message.innerText = "", 3000);
        }

        input.value = "";
      }
    }

    function addCharacter() {
      const selected = document.getElementById("characterSelect").value;
      const amount = parseInt(document.getElementById("amountInput").value);
      if (!inventory[selected]) inventory[selected] = 0;
      inventory[selected] += amount;
      localStorage.setItem("inventory", JSON.stringify(inventory));
      updateInventory();
    }

    function toggleAutoClicker() {
      if (autoClickerInterval) {
        clearInterval(autoClickerInterval);
        autoClickerInterval = null;
      } else {
        autoClickerInterval = setInterval(rollItem, 500);
      }
    }

    function toggleAdminModal() {
      const modal = document.getElementById("adminModal");
      modal.style.display = (modal.style.display === "block") ? "none" : "block";
    }

    function hideAdminIcon() {
      document.getElementById("adminButton").style.display = "none";
      document.getElementById("adminModal").style.display = "none";
    }

    updateInventory();
  </script>
</body>
</html>
<!-- This HTML file is a simple web application that simulates opening a virtual "ano" (a type of container) to find characters. It includes an inventory system, an admin panel for adding characters, and a review input field. The design is playful and colorful, with animations for certain characters. The code uses JavaScript to handle the logic and interactions, including local storage for saving progress. -->
