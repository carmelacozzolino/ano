<!DOCTYPE html>
<html>
<head>
  <title>ano simulator</title>
  <style>
    body {
      background-color: #111;
      font-family: 'Comic Sans MS', sans-serif;
      color: #eee;
      text-align: center;
      padding-top: 50px;
      position: relative;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      margin: 10px;
    }

    #result {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
    }

    #loading {
      font-size: 20px;
      margin-top: 20px;
      display: none;
    }

    #inventory {
      margin-top: 40px;
      font-size: 20px;
    }

    .character {
      margin: 10px;
      display: block;
    }

    .character img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .shiny {
      animation: shiny-glow 1s infinite alternate;
      text-shadow: 0 0 10px gold;
    }

    @keyframes shiny-glow {
      from { filter: drop-shadow(0 0 5px gold); }
      to { filter: drop-shadow(0 0 15px gold); }
    }

    .bounce {
      animation: bounce 1s ease infinite;
    }

    #eraseButton {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    #adminPanelButton {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      cursor: pointer;
      display: none;
    }

    #adminPopup {
      display: none;
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
      z-index: 999;
      max-width: 90%;
    }

    #adminPopup h2 {
      margin-top: 0;
    }

    #closePopup {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    .chanceInput {
      width: 60px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>apri l'ano di shibi</h1>
  <button onclick="rollItem()">apri</button>
  <div id="loading">sto rullando...</div>
  <div id="result">clicca sul pulsante</div>
  <div id="image"></div>
  <div id="inventory"></div>
  <button id="eraseButton" onclick="confirmReset()">cancella progresso</button>

  <div>
    <h3>lascia una recensione</h3>
    <input id="secretInput" type="text" placeholder="scrivi qualcosa..." onkeydown="handleKey(event)">
    <div id="reviewMessage" style="margin-top:10px; color:lightgreen;"></div>
  </div>

  <div id="adminPanelButton" onclick="toggleAdminPopup()">🛠️</div>

  <div id="adminPopup">
    <div id="closePopup" onclick="toggleAdminPopup()">X</div>
    <h2>pannello admin</h2>
    <div id="chanceControls"></div>
    <button onclick="saveChances()">Salva probabilità</button>
    <button onclick="resetChancesToDefault()">Ripristina probabilità</button>
    <div style="margin-top: 10px;">
      <select id="characterSelect"></select>
      <input type="number" id="amountInput" min="1" value="1">
      <button onclick="addCharacter()">aggiungi</button>
    </div>
    <button onclick="toggleAutoClicker()">autoclicker</button>
    <button onclick="hideAdminIcon()">nascondi icona</button>
    <div id="chanceWarning" style="color: red; margin-top: 10px;"></div>
  </div>

  <script>
    const defaultItems = [
      { name: "lilli", chance: 44, color: "gray", image: "https://i.imgur.com/XZ9BFJf.jpeg" },
      { name: "mamma", chance: 30, color: "green", image: "https://i.imgur.com/y0nwHqo.jpeg" },
      { name: "babbo", chance: 10, color: "blue", image: "https://i.imgur.com/Nr3S7Op.jpeg" },
      { name: "nonna sbuffa", chance: 13.5, color: "purple", image: "https://i.imgur.com/RF1vAuN.jpeg" },
      { name: "peppa", chance: 1.5, color: "pink", image: "https://i.imgur.com/paK8Obq.jpeg", extraIcon: "https://i.imgur.com/v9woUlU.jpeg" },
      { name: "zia puzza", chance: 1, color: "gold", image: "https://i.imgur.com/i9vmLb3.png" },
      { name: "carmela cozzolino", chance: 0.1, color: "gold", image: "https://i.imgur.com/6wzgV0M.jpeg", shiny: true }
    ];

    let items = JSON.parse(localStorage.getItem("customChances")) || defaultItems;
    let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
    let autoClickerInterval = null;
    let confirmResetOnce = false;

    function rollItem() {
      document.getElementById("loading").style.display = "block";
      document.getElementById("result").innerText = "";
      document.getElementById("image").innerHTML = "";

      setTimeout(() => {
        document.getElementById("loading").style.display = "none";

        let roll = Math.random() * 100;
        let cumulative = 0;

        for (let item of items) {
          cumulative += item.chance;
          if (roll <= cumulative) {
            if (!inventory[item.name]) inventory[item.name] = 0;
            inventory[item.name]++;
            localStorage.setItem("inventory", JSON.stringify(inventory));

            const resultDiv = document.getElementById("result");
            resultDiv.innerText = `hai trovato ${item.name}`;
            resultDiv.style.color = item.color;
            resultDiv.className = item.shiny ? "shiny" : "";

            const img = document.createElement("img");
            img.src = item.image;
            img.width = 150;
            if (item.shiny) {
              resultDiv.classList.add("bounce");
              img.classList.add("bounce");
            }

            document.getElementById("image").appendChild(img);
            updateInventory();
            break;
          }
        }
      }, 1000);
    }

    function updateInventory() {
      const invDiv = document.getElementById("inventory");
      invDiv.innerHTML = "<h2>inventario</h2>";
      for (let item of items) {
        const count = inventory[item.name] || 0;
        invDiv.innerHTML += `
          <div class="character">
            <img src="${item.image}">
            <div style="color:${item.color}" class="${item.shiny ? 'shiny' : ''}">
              ${item.name} ${item.extraIcon ? `<img src="${item.extraIcon}" style="width: 15px; height: 15px; vertical-align: middle;">` : ''}: ${count}
            </div>
          </div>
        `;
      }
    }

    function confirmReset() {
      const resultDiv = document.getElementById("result");
      if (!confirmResetOnce) {
        resultDiv.innerText = "sei sicuro che vuoi cancellare il tuo progresso? clicca di nuovo per confermare.";
        resultDiv.style.color = "red";
        confirmResetOnce = true;
        setTimeout(() => {
          confirmResetOnce = false;
          resultDiv.innerText = "clicca sul pulsante";
          resultDiv.style.color = "#eee";
        }, 5000);
      } else {
        localStorage.removeItem("inventory");
        inventory = {};
        updateInventory();
        resultDiv.innerText = "progresso cancellato!";
        resultDiv.style.color = "#eee";
        document.getElementById("image").innerHTML = "";
        confirmResetOnce = false;
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        const input = document.getElementById("secretInput");
        if (input.value.toLowerCase().trim() === "ano zozzo") {
          document.getElementById("adminPanelButton").style.display = "block";
        }
        document.getElementById("reviewMessage").innerText = "grazie per la recensione!";
        input.value = "";
      }
    }

    function toggleAdminPopup() {
      const popup = document.getElementById("adminPopup");
      popup.style.display = popup.style.display === "none" ? "block" : "none";
      generateChanceInputs();
    }

    function hideAdminIcon() {
      document.getElementById("adminPanelButton").style.display = "none";
      document.getElementById("adminPopup").style.display = "none";
    }

    function generateChanceInputs() {
      const container = document.getElementById("chanceControls");
      const select = document.getElementById("characterSelect");
      container.innerHTML = "";
      select.innerHTML = "";
      items.forEach((item, index) => {
        container.innerHTML += `
          <div>
            ${item.name}: <input type="number" class="chanceInput" id="chance-${index}" value="${item.chance}" min="0" max="100">%
          </div>
        `;
        select.innerHTML += `<option value="${item.name}">${item.name}</option>`;
      });
    }

    function saveChances() {
      let newItems = [...items];
      let total = 0;
      newItems.forEach((item, i) => {
        const val = parseFloat(document.getElementById(`chance-${i}`).value);
        item.chance = val;
        total += val;
      });
      if (Math.abs(total - 100) > 0.1) {
        document.getElementById("chanceWarning").innerText = "le probabilità devono sommare 100%";
        return;
      }
      items = newItems;
      localStorage.setItem("customChances", JSON.stringify(items));
      document.getElementById("chanceWarning").innerText = "salvato!";
    }

    function resetChancesToDefault() {
      items = JSON.parse(JSON.stringify(defaultItems));
      localStorage.removeItem("customChances");
      generateChanceInputs();
      updateInventory();
      document.getElementById("chanceWarning").innerText = "probabilità ripristinate!";
    }

    function addCharacter() {
      const selected = document.getElementById("characterSelect").value;
      const amount = parseInt(document.getElementById("amountInput").value);
      if (!inventory[selected]) inventory[selected] = 0;
      inventory[selected] += amount;
      localStorage.setItem("inventory", JSON.stringify(inventory));
      updateInventory();
    }

    function toggleAutoClicker() {
      if (autoClickerInterval) {
        clearInterval(autoClickerInterval);
        autoClickerInterval = null;
      } else {
        autoClickerInterval = setInterval(rollItem, 500);
      }
    }

    updateInventory();
  </script>
</body>
</html>
