<!DOCTYPE html>
<html>
<head>
  <title>ano simulator</title>
  <style>
    body {
      background-color: #111;
      font-family: 'Comic Sans MS', sans-serif;
      color: #eee;
      text-align: center;
      padding-top: 50px;
      position: relative;
      transition: background 0.5s;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #fff;
      color: #000;
      border: none;
      border-radius: 5px;
      margin: 10px;
    }

    #themeButton {
      position: static;
      margin-top: 10px;
      left: unset;
      bottom: unset;
      transform: none;
    }

    .theme-normale {
      --bg-color: #111;
      --text-color: #eee;
      --btn-bg: #fff;
      --btn-text: #000;
      --popup-bg: #222;
    }

    .theme-chiaro {
      --bg-color: #f4f4f4;
      --text-color: #111;
      --btn-bg: #ddd;
      --btn-text: #000;
      --popup-bg: #fff;
    }

    .theme-arcobaleno {
      --bg-color: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      --text-color: #fff;
      --btn-bg: rgba(255, 255, 255, 0.8);
      --btn-text: #000;
      --popup-bg: rgba(0,0,0,0.6);
    }

    .theme-lava {
      --bg-color: #2c0f0f;
      --text-color: #ffcccc;
      --btn-bg: #990000;
      --btn-text: #fff;
      --popup-bg: #400000;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
    }

    button {
      background-color: var(--btn-bg);
      color: var(--btn-text);
    }

    #adminPopup {
      background-color: var(--popup-bg);
    }

    #result, #loading {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
    }

    #inventory {
      margin-top: 40px;
      font-size: 20px;
    }

    .character {
      margin: 10px;
      display: block;
    }

    .character img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .shiny {
      animation: shiny-glow 1s infinite alternate;
      text-shadow: 0 0 10px gold;
    }

    @keyframes shiny-glow {
      from { filter: drop-shadow(0 0 5px gold); }
      to { filter: drop-shadow(0 0 15px gold); }
    }

    .bounce {
      animation: bounce 1s ease infinite;
    }

    #eraseButton {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    #adminPanelButton {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      cursor: pointer;
      display: none;
    }

    #adminPopup {
      display: none;
      position: fixed;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px;
      border-radius: 10px;
      z-index: 999;
      max-width: 90%;
    }

    #adminPopup h2 {
      margin-top: 0;
    }

    #closePopup {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    .chanceInput {
      width: 60px;
      margin-left: 10px;
    }

    .craftMessage {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body class="theme-normale">
  <h1>apri l'ano di shibi</h1>

  <div style="display: flex; justify-content: center; align-items: start; gap: 40px; flex-wrap: wrap;">
    <!-- Roll system -->
    <div>
      <button onclick="rollItem()">apri</button>
      <div id="loading" style="display:none;">sto rullando...</div>
      <div id="result">clicca sul pulsante</div>
      <div id="image"></div>
    </div>

    <!-- Crafting system -->
    <div id="craftingSection" style="background-color: var(--popup-bg); padding: 20px; border-radius: 10px; max-width: 300px; display: none;">
      <h3 style="margin-top: 0;">crafta personaggi</h3>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <select id="craft1" style="padding: 5px;"></select>
        <select id="craft2" style="padding: 5px;"></select>
        <button onclick="craftCharacter()">CRAFTA</button>
        <div id="craftMessage" class="craftMessage"></div>
      </div>
    </div>
  </div>

  <div id="inventory"></div>
  <button id="eraseButton" onclick="confirmReset()">cancella progresso</button>

  <div>
    <h3>lascia una recensione</h3>
    <input id="secretInput" type="text" placeholder="scrivi qualcosa..." onkeydown="handleKey(event)">
    <div id="reviewMessage" style="margin-top:10px; color:lightgreen;"></div>
  </div>

  <div id="adminPanelButton" onclick="toggleAdminPopup()">🛠️</div>

  <div id="adminPopup">
    <div id="closePopup" onclick="toggleAdminPopup()">X</div>
    <h2>pannello admin</h2>
    <div id="chanceControls"></div>
    <button onclick="saveChances()">Salva probabilità</button>
    <button onclick="resetChancesToDefault()">Ripristina probabilità</button>
    <div style="margin-top: 10px;">
      <select id="characterSelect"></select>
      <input type="number" id="amountInput" min="1" value="1">
      <button onclick="addCharacter()">aggiungi</button>
    </div>
    <button onclick="toggleAutoClicker()">autoclicker</button>
    <button onclick="hideAdminIcon()">nascondi icona</button>
    <div id="chanceWarning" style="color: red; margin-top: 10px;"></div>
    <button id="themeButton" onclick="cycleTheme()">🎨 Cambia tema</button>
  </div>

  <script>
    const defaultItems = [
      { name: "lilli", chance: 44, color: "gray", image: "https://i.imgur.com/XZ9BFJf.jpeg" },
      { name: "mamma", chance: 30, color: "green", image: "https://i.imgur.com/y0nwHqo.jpeg" },
      { name: "babbo", chance: 10, color: "blue", image: "https://i.imgur.com/Nr3S7Op.jpeg" },
      { name: "nonna sbuffa", chance: 13.5, color: "purple", image: "https://i.imgur.com/RF1vAuN.jpeg" },
      { name: "peppa", chance: 1.5, color: "pink", image: "https://i.imgur.com/paK8Obq.jpeg", extraIcon: "https://i.imgur.com/v9woUlU.jpeg" },
      { name: "zia puzza", chance: 1, color: "olive", image: "https://i.imgur.com/i9vmLb3.png" },
      { name: "carmela cozzolino", chance: 0.1, color: "gold", image: "https://i.imgur.com/6wzgV0M.jpeg", shiny: true },
      { name: "nonna puzza", chance: 0, color: "slateblue", image: "https://i.imgur.com/zPgNMgD.png" },
      { name: "pippi", chance: 0, color: "slateblue", image: "https://i.imgur.com/bgAGCAt.png" },
      { name: "babbo sbuffo", chance: 0, color: "slateblue", image: "https://i.imgur.com/gh9qJiQ.png" }
    ];

    const recipes = {
      "nonna sbuffa+zia puzza": "nonna puzza",
      "zia puzza+nonna sbuffa": "nonna puzza",
      "peppa+lilli": "pippi",
      "lilli+peppa": "pippi",
      "babbo+nonna sbuffa": "babbo sbuffo",
      "nonna sbuffa+babbo": "babbo sbuffo"
    };

    let items = JSON.parse(localStorage.getItem("customChances")) || defaultItems;

    // Ensure all defaultItems are present in items (for admin panel and crafting)
    defaultItems.forEach(def => {
      if (!items.find(it => it.name === def.name)) {
        items.push(def);
      }
    });

    let inventory = JSON.parse(localStorage.getItem("inventory")) || {};
    let autoClickerInterval = null;
    let confirmResetOnce = false;

    function rollItem() {
      document.getElementById("loading").style.display = "block";
      document.getElementById("result").innerText = "";
      document.getElementById("image").innerHTML = "";

      setTimeout(() => {
        document.getElementById("loading").style.display = "none";
        let roll = Math.random() * 100;
        let cumulative = 0;

        for (let item of items) {
          cumulative += item.chance;
          if (roll <= cumulative) {
            if (!inventory[item.name]) inventory[item.name] = 0;
            inventory[item.name]++;
            localStorage.setItem("inventory", JSON.stringify(inventory));

            const resultDiv = document.getElementById("result");
            resultDiv.innerText = `hai trovato ${item.name}`;
            resultDiv.style.color = item.color;
            resultDiv.className = item.shiny ? "shiny" : "";

            const img = document.createElement("img");
            img.src = item.image;
            img.width = 150;
            if (item.shiny) {
              resultDiv.classList.add("bounce");
              img.classList.add("bounce");
            }

            document.getElementById("image").appendChild(img);
            updateInventory();
            break;
          }
        }
      }, 1000);
    }

    function updateInventory() {
      const invDiv = document.getElementById("inventory");
      invDiv.innerHTML = "<h2>inventario</h2>";
      let allNormalItemsFound = true;

      for (let item of items) {
        const count = inventory[item.name] || 0;
        if (item.chance > 0 && count === 0) {
          allNormalItemsFound = false;
        }

        // Show all characters you have, even if chance is 0 (like pippi, babbo sbuffo)
        if (count > 0) {
          invDiv.innerHTML += `
            <div class="character">
              <img src="${item.image}">
              <div style="color:${item.color}" class="${item.shiny ? 'shiny' : ''}">
                ${item.name} ${item.extraIcon ? `<img src="${item.extraIcon}" style="width: 15px; height: 15px; vertical-align: middle;">` : ''}: ${count}
              </div>
            </div>
          `;
        }
      }

      document.getElementById("craftingSection").style.display = allNormalItemsFound ? "block" : "none";
      updateCraftingOptions();
    }

    function updateCraftingOptions() {
      const craft1 = document.getElementById("craft1");
      const craft2 = document.getElementById("craft2");
      craft1.innerHTML = "";
      craft2.innerHTML = "";
      for (let item of items) {
        if ((inventory[item.name] || 0) > 0) {
          const opt1 = new Option(item.name, item.name);
          const opt2 = new Option(item.name, item.name);
          craft1.add(opt1);
          craft2.add(opt2);
        }
      }
    }

    function craftCharacter() {
      const selected1 = document.getElementById("craft1").value;
      const selected2 = document.getElementById("craft2").value;

      if (selected1 === selected2) {
        document.getElementById("craftMessage").innerText = "seleziona due personaggi diversi!";
        return;
      }

      const recipeKey = `${selected1}+${selected2}`;

      if (recipes[recipeKey]) {
        const craftedCharacter = recipes[recipeKey];
        inventory[craftedCharacter] = (inventory[craftedCharacter] || 0) + 1;
        localStorage.setItem("inventory", JSON.stringify(inventory));
        document.getElementById("craftMessage").innerText = `hai craftato ${craftedCharacter}!`;
        updateInventory();
      } else {
        document.getElementById("craftMessage").innerText = "combinazione non valida.";
      }
    }

    function addCharacter() {
      const characterName = document.getElementById("characterSelect").value;
      const amount = parseInt(document.getElementById("amountInput").value) || 1;
      if (characterName && amount > 0) {
        inventory[characterName] = (inventory[characterName] || 0) + amount;
        localStorage.setItem("inventory", JSON.stringify(inventory));
        updateInventory();
      }
    }

    function confirmReset() {
      const resultDiv = document.getElementById("result");
      if (!confirmResetOnce) {
        resultDiv.innerText = "vuoi davvero cancellare il tuo progresso? clicca di nuovo per confermare";
        resultDiv.style.color = "red";
        confirmResetOnce = true;
        setTimeout(() => {
          confirmResetOnce = false;
          resultDiv.innerText = "apri l'ano di shibi";
          resultDiv.style.color = "var(--text-color)";
        }, 5000);
      } else {
        localStorage.removeItem("inventory");
        inventory = {};
        updateInventory();
        resultDiv.innerText = "progresso cancellato!";
        // Clear the last rolled character image
        document.getElementById("image").innerHTML = "";
        confirmResetOnce = false;
      }
    }

    function handleKey(e) {
      if (e.key === "Enter") {
        const input = document.getElementById("secretInput");
        if (input.value.toLowerCase().trim() === "ano zozzo") {
          document.getElementById("adminPanelButton").style.display = "block";
        }
        document.getElementById("reviewMessage").innerText = "grazie per la recensione!";
        input.value = "";
      }
    }

    function toggleAdminPopup() {
      const popup = document.getElementById("adminPopup");
      popup.style.display = popup.style.display === "none" ? "block" : "none";
      generateChanceInputs();
      populateCharacterSelect();
    }

    function hideAdminIcon() {
      document.getElementById("adminPanelButton").style.display = "none";
    }

    function saveChances() {
      document.querySelectorAll(".chanceInput").forEach((input, i) => {
        const val = parseFloat(input.value);
        if (!isNaN(val)) items[i].chance = val;
      });
      localStorage.setItem("customChances", JSON.stringify(items));
      updateInventory();
    }

    function resetChancesToDefault() {
      // Force clear custom chances so colors update
      localStorage.removeItem("customChances");
      items = JSON.parse(JSON.stringify(defaultItems));
      updateInventory();
      generateChanceInputs();
    }

    function generateChanceInputs() {
      const controls = document.getElementById("chanceControls");
      controls.innerHTML = "";
      items.forEach((item, index) => {
        const div = document.createElement("div");
        div.innerHTML = `<label>${item.name} chance:</label>
                         <input type="number" class="chanceInput" value="${item.chance}" min="0" max="100" />`;
        controls.appendChild(div);
      });
    }

    function populateCharacterSelect() {
      const characterSelect = document.getElementById("characterSelect");
      characterSelect.innerHTML = "";
      items.forEach(item => {
        const option = new Option(item.name, item.name);
        characterSelect.appendChild(option);
      });
    }

    const themes = ['theme-normale', 'theme-chiaro', 'theme-arcobaleno', 'theme-lava'];
    let currentTheme = 0;

    function cycleTheme() {
      document.body.classList.remove(themes[currentTheme]);
      currentTheme = (currentTheme + 1) % themes.length;
      document.body.classList.add(themes[currentTheme]);
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateInventory();
    });
  </script>
</body>
</html>
<!-- End of index.html -->
